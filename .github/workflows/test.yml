name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest -v
      - name: Run MCP preflight
        run: python mcp_preflight.py
      - name: Generate simulated M0 evidence
        run: python m0_harness.py --out artifacts/m0
      - name: Build M0 capability report
        run: python build_m0_report.py
